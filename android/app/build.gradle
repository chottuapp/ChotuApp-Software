plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.chotuapp.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.chotuapp.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = '3.11'
        pip { install 'requests'; install 'beautifulsoup4'; install 'openpyxl' }
    }
}

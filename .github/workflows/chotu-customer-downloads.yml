name: Deliver Verified Customer APK and AAB
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      build_run:
        required: true
        type: string
      native_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  github-downloads:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-user-apk
          path: ${{ runner.temp }}/android-downloads
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require successful native check of this exact signed build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run || github.run_id }}
          NATIVE_RUN: ${{ inputs.native_run || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$NATIVE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" > "$RUNNER_TEMP/native-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/native-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" > "$RUNNER_TEMP/build-jobs.json"
          python3 - <<'PYGATE'
          import os,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);r=json.loads((p/'native-run.json').read_text());jobs=json.loads((p/'native-jobs.json').read_text())['jobs']
          assert r['path']=='.github/workflows/chotu-customer-performance.yml' and r['event']=='workflow_dispatch' and r['head_branch']=='main'
          assert r['repository']['full_name']=='chottuapp/ChotuApp-Software'
          assert any(j['name']=='build' and j['conclusion']=='success' for j in json.loads((p/'build-jobs.json').read_text())['jobs'])
          native=[j for j in jobs if j['name']=='native-test' and j['conclusion']=='success'];assert len(native)==1
          (p/'native-job-id').write_text(str(native[0]['id']))
          PYGATE
          native_job=$(cat "$RUNNER_TEMP/native-job-id")
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$native_job/logs" > "$RUNNER_TEMP/native-log.txt"
          python3 - <<'PYIDENTITY'
          import os,re
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'native-log.txt').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          assert re.search(r'\brun-id:\s*'+re.escape(os.environ['BUILD_RUN'])+r'\b',text),'Native check used another artifact'
          assert re.search(r'\bSOURCE_SHA:\s*'+re.escape(os.environ['SOURCE_SHA'])+r'\b',text),'Native check used another source'
          print('Native check matches the exact build artifact and source commit.')
          PYIDENTITY
      - name: Verify signed file identities before GitHub upload
        run: |
          python3 - <<'PY'
          import os,json,hashlib,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'android-downloads'
          m=json.loads((p/'customer-apk-build-info.json').read_text())
          assert m['commit']==os.environ['SOURCE_SHA'] and m['version_name']=='1.1.30' and m['version_code']==72
          assert m['certificate_sha256']=='b2067fea0ed2c29e081131f08e5c9bf4761d7b7d4cf44c71bcbd997124cd5352'
          for name,size,sha in [('ChotuApp-User-1.1.30-72.apk',m['bytes'],m['sha256']),('ChotuApp-User-1.1.30-72.aab',m['aab']['bytes'],m['aab']['sha256'])]:
              f=p/name
              assert f.stat().st_size==size and hashlib.sha256(f.read_bytes()).hexdigest()==sha
              with zipfile.ZipFile(f) as z:
                  assert z.testzip() is None
                  assert not any(n.endswith(('assets/chotu.json','.jks','.keystore','.pem','/.env')) for n in z.namelist())
          print('Signed APK and AAB identity, hashes, certificate metadata and archives verified.')
          PY
      - name: Store requested Android files as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=user-v1.1.30-72
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::This release already exists; refusing to overwrite files.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Signed ChotuApp User 1.1.30 (72), with the original customer signing certificate.

          Includes location-free nationwide discovery, bounded card image decoding, edge-to-edge handling and optimized Android release shrinking. Existing shopping/gallery flows are regression-tested.
          IMPORTANT: the new shop price/discount sorting requires the separate pending backend release; that backend has not been deployed by this build.

          APK and AAB were built from the same source and checked for identity, archive integrity and signature metadata. The APK passed the existing native upgrade/startup check. SHA256 values and exact source commit are in customer-apk-build-info.json.

          GitHub downloads only. This workflow does not activate an APK on the production server or upload to Google Play.
          NOTES
          gh release create "$tag" "$RUNNER_TEMP/android-downloads/ChotuApp-User-1.1.30-72.apk" "$RUNNER_TEMP/android-downloads/ChotuApp-User-1.1.30-72.aab" "$RUNNER_TEMP/android-downloads/customer-apk-build-info.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChotuApp User 1.1.30 (72) — APK and AAB" --notes-file "$RUNNER_TEMP/android-release-notes.md" --prerelease --latest=false

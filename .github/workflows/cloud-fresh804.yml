name: ChotuApp Fresh Fetch with 804 Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud/audit804-release.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: chotuapp-fresh804-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify audit safety gates before restarting fetches
        run: PYTHONPATH=tests:cloud:. python -m unittest test_audit804 test_audit804_delivery test_fresh804 test_laam_owner_filter -q
      - name: Save and stop superseded fetches; dispatch fresh three-store groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/fresh804_dispatch.py

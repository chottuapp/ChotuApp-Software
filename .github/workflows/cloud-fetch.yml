name: ChotuApp Cloud Fetch
run-name: ${{ inputs.continuation_parent != '' && format('Automatic continuation of {0}', inputs.continuation_parent) || (inputs.runner_group != '' && format('Cloud group {0}', inputs.runner_group) || format('Cloud fetch by @{0}', github.actor)) }}
on:
  workflow_dispatch:
    inputs:
      stores:
        description: 'Fresh run: Name | https://store.com; Other Name | https://other.com'
        required: false
        default: 'Farda Foods | https://fardafoods.com; Islamabad Tea | https://islamabadtea.pk'
        type: string
      runner_group:
        description: 'Internal runner group; independent concurrency and continuation identity'
        required: false
        type: string
      partition_resume:
        description: 'Internal: select only the supplied group from the restored parent checkpoint'
        default: false
        type: boolean
      resume_run_id:
        description: 'Optional: previous Actions run ID with a checkpoint; leaves completed stores alone'
        required: false
        type: string
      save_checkpoint:
        description: 'Upload resume checkpoint (large saves split into parts; uses artifact storage)'
        default: true
        type: boolean
      auto_continue_once:
        description: 'After budget expiry, resume once for 300 more minutes if checkpoint succeeds'
        default: false
        type: boolean
      auto_continue_limit:
        description: 'Additional checkpoint runs: 0 disables chaining, default 4, maximum 6; no-progress guard applies'
        default: '4'
        type: string
      continuation_index:
        description: 'Internal continuation counter; leave 0 for a manual resume'
        default: '0'
        type: string
      previous_progress:
        description: 'Internal progress fingerprint; leave blank for manual runs'
        required: false
        type: string
      stalled_runs:
        description: 'Internal no-progress counter; leave 0 for manual runs'
        default: '0'
        type: string
      continuation_parent:
        description: 'Internal automatic-continuation parent ID; leave blank for manual runs'
        required: false
        type: string
      minutes:
        description: 'Maximum fetch time, 1–300 minutes'
        default: '285'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.runner_group != '' && format('chotuapp-cloud-fetch-{0}', inputs.runner_group) || 'chotuapp-cloud-fetch' }}
  cancel-in-progress: false
jobs:
  fetch:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CHOTUAPP_CLOUD_DATA: ${{ github.workspace }}/.cloud-data
      CLOUD_RUNNER_GROUP: ${{ inputs.runner_group }}
      CLOUD_PARTITION_RESUME: ${{ inputs.partition_resume }}
      CLOUD_STORES: ${{ inputs.stores }}
      CLOUD_MINUTES: ${{ inputs.minutes }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      SAVE_CHECKPOINT: ${{ inputs.save_checkpoint }}
      CLOUD_AUTO_CONTINUE: ${{ inputs.auto_continue_once }}
      CLOUD_AUTO_CONTINUE_LIMIT: ${{ inputs.auto_continue_limit }}
      CLOUD_CONTINUATION_INDEX: ${{ inputs.continuation_index }}
      CLOUD_PREVIOUS_PROGRESS: ${{ inputs.previous_progress }}
      CLOUD_STALLED_RUNS: ${{ inputs.stalled_runs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: |
          if ! python -c "import tkinter"; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-tk
          fi
          python -m pip install -r requirements.txt
      - name: Restore optional saved run
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RESUME_RUN_ID" in *[!0-9]*|'') echo 'Run ID must contain only digits'; exit 1;; esac
          python cloud/download_checkpoint.py --run "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/chotu-restore"
          python cloud/prepare_resume.py --archive "$RUNNER_TEMP/chotu-restore" --data .cloud-data
      - name: Install Czone browser fallback when needed
        if: env.CLOUD_NEEDS_CZONE_BROWSER == 'true' || (inputs.resume_run_id == '' && contains(inputs.stores, 'czone.com.pk'))
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Start continuous fetching on the cloud runner
        id: launch
        run: python cloud/background_run.py start .cloud-data
      - name: Live progress, logs and completed-file uploads
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/monitor-cloud
      - name: Fetch result
        if: always() && steps.launch.outcome == 'success'
        run: python cloud/background_run.py finish .cloud-data
      - name: Collect diagnostic report even if fetching failed
        if: always()
        run: python cloud/diagnostics.py --data .cloud-data --output .cloud-data/diagnostics
      - name: Upload diagnostic report and redacted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-diagnostics
          path: .cloud-data/diagnostics/
          if-no-files-found: warn
          retention-days: 1
      - name: Upload Excel files and audits, including completed stores from a partial run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-excel-files
          overwrite: true
          path: .cloud-data/ANAS_DATA_FETCH/
          if-no-files-found: warn
          retention-days: 1
      - name: Final automated Rule 804 pass for fresh batch
        if: always() && startsWith(env.CLOUD_RUNNER_GROUP, 'fresh26-')
        run: python cloud/rule804_pipeline.py .cloud-data/ANAS_DATA_FETCH .cloud-data/rule804-excel
      - name: Upload automated Rule 804 fresh workbooks
        if: always() && startsWith(env.CLOUD_RUNNER_GROUP, 'fresh26-')
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-rule804-files
          overwrite: true
          path: .cloud-data/rule804-excel/
          if-no-files-found: warn
          retention-days: 3
      - name: Upload saved checkpoint when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-checkpoint
          path: |
            checkpoint.zip
            checkpoint.parts/
          if-no-files-found: warn
          retention-days: 1
      - name: Dispatch authorized continuation after verified checkpoint upload
        if: always() && !cancelled() && steps.launch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/auto_continue.py --current-run


  diagnostic-archive:
    name: Archive structured diagnostics
    needs: fetch
    if: always() && !cancelled()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: chotuapp-diagnostics
          path: incoming-diagnostics
      - name: Archive credential-free JSON on the cloud-reports branch
        run: python cloud/publish_report.py incoming-diagnostics/report.json

name: ChotuApp Cloud Fetch
run-name: Cloud fetch by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      stores:
        description: 'Fresh run: Name | https://store.com; Other Name | https://other.com'
        required: false
        default: 'Farda Foods | https://fardafoods.com; Islamabad Tea | https://islamabadtea.pk'
        type: string
      resume_run_id:
        description: 'Optional: previous Actions run ID with a checkpoint; leaves completed stores alone'
        required: false
        type: string
      save_checkpoint:
        description: 'Upload resume checkpoint (up to 250 MB; uses artifact storage)'
        default: false
        type: boolean
      minutes:
        description: 'Maximum fetch time, 1–300 minutes'
        default: '285'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: chotuapp-cloud-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CHOTUAPP_CLOUD_DATA: ${{ github.workspace }}/.cloud-data
      CLOUD_STORES: ${{ inputs.stores }}
      CLOUD_MINUTES: ${{ inputs.minutes }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      SAVE_CHECKPOINT: ${{ inputs.save_checkpoint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
          python -m pip install -r requirements.txt
      - name: Install Czone browser fallback when needed
        if: inputs.resume_run_id != '' || contains(inputs.stores, 'czone.com.pk')
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Restore optional saved run
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RESUME_RUN_ID" in *[!0-9]*|'') echo 'Run ID must contain only digits'; exit 1;; esac
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name chotuapp-checkpoint --dir "$RUNNER_TEMP/chotu-restore"
      - name: Start continuous fetching on the cloud runner
        id: launch
        run: python cloud/background_run.py start .cloud-data
      - name: Live progress, logs and completed-file uploads
        uses: ./.github/actions/monitor-cloud
      - name: Fetch result
        if: always() && steps.launch.outcome == 'success'
        run: python cloud/background_run.py finish .cloud-data
      - name: Collect diagnostic report even if fetching failed
        if: always()
        run: python cloud/diagnostics.py --data .cloud-data --output .cloud-data/diagnostics
      - name: Upload diagnostic report and redacted log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-diagnostics
          path: .cloud-data/diagnostics/
          if-no-files-found: warn
          retention-days: 1
      - name: Upload Excel files and audits, including completed stores from a partial run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-excel-files
          overwrite: true
          path: .cloud-data/ANAS_DATA_FETCH/
          if-no-files-found: warn
          retention-days: 1
      - name: Upload optional saved checkpoint
        if: always() && inputs.save_checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-checkpoint
          path: checkpoint.zip
          if-no-files-found: warn
          retention-days: 1

  diagnostic-archive:
    name: Archive structured diagnostics
    needs: fetch
    if: always() && !cancelled()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: chotuapp-diagnostics
          path: incoming-diagnostics
      - name: Archive credential-free JSON on the cloud-reports branch
        run: python cloud/publish_report.py incoming-diagnostics/report.json

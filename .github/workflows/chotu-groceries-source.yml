name: ChotuApp Groceries Source Check
on:
  workflow_dispatch:
    inputs:
      brand_names:
        description: Optional one to three exact approved Naheed brands for discovery verification
        required: false
        type: string
      checkpoint_run:
        description: Optional completed grocery run for bounded cached-pagination inspection
        required: false
        type: string
      public_scope_indexes:
        description: Optional comma-separated owner scope indexes for bounded anonymous UI diagnosis
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: chotu-groceries-source
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - if: inputs.checkpoint_run == ''
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: cloud:.
          GROCERY_PUBLIC_SCOPE_INDEXES: ${{ inputs.public_scope_indexes }}
          GROCERY_BRAND_NAMES: ${{ inputs.brand_names }}
          GROCERY_CHECKPOINT_RUN: ${{ inputs.checkpoint_run }}
        run: |
          if [ -n "$GROCERY_BRAND_NAMES" ]; then
            python cloud/naheed_brand_probe.py
          elif [ -n "$GROCERY_PUBLIC_SCOPE_INDEXES" ]; then
            python cloud/grocery_scope_ui_probe.py
          elif [ -n "$GROCERY_CHECKPOINT_RUN" ]; then
            python cloud/groceries_checkpoint_probe.py
          else
            python cloud/chotu_groceries_probe.py
          fi

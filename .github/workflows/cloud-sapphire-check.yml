name: ChotuApp Sapphire Public Page Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chotuapp-sapphire-source-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verify permitted public product and size pages
        run: python cloud/sapphire_probe.py
      - name: Retain credential-free public source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sapphire-public-route-check
          path: source-diagnostics/sapphire-public-route.json
          retention-days: 3

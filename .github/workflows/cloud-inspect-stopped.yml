name: Inspect Stopped Fetch
on:
  push:
    branches: [main]
    paths: [cloud/inspect-stopped-request.json]
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'Optional comma-separated completed run IDs, at most three'
        required: false
        type: string
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: cloud:.
          SOURCE_INSPECT_RUNS: ${{ inputs.run_ids }}
        run: python cloud/inspect_stopped.py

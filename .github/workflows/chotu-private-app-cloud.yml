name: Chotu Private App Cloud Build
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed 40-character private app commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chotu-private-app-cloud-build
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: chotu-cloud-build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        client: [user, admin]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CLIENT: ${{ matrix.client }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: false
      - name: Test and build production client without exposing private source logs
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          if ! bash scripts/cloud/build-web-client.sh > "$RUNNER_TEMP/private-build.log" 2>&1; then
            echo "::error::Production $CLIENT tests/build failed. Private build logs were not published. No live site was changed."
            exit 1
          fi
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'chotu-private-source'
          client=os.environ['CLIENT']; base=root/('chotu_app' if client=='user' else 'chotu-admin')/'build/web'
          info=json.loads((base/'build-info.json').read_text())
          assert info['commit']==os.environ['SOURCE_SHA'] and info['client']==client
          assert info['environment']=='production' and info['api_base']=='https://app.chotuapp.com'
          for p in base.rglob('*'):
              assert not p.is_symlink(), 'No symlinks allowed in public build output'
              assert p.name not in {'.env','key.properties','.git'}
              assert p.suffix not in {'.dart','.php','.pem','.jks','.keystore','.map'}, 'Private source/config must not be uploaded'
          shutil.copytree(base,Path(os.environ['RUNNER_TEMP'])/'public-client')
          print('Production client tests and compilation passed. Only compiled browser assets are uploaded; no deployment was performed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-${{ matrix.client }}
          path: ${{ runner.temp }}/public-client
          include-hidden-files: true
          retention-days: 1
      - name: Remove temporary private checkout and logs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chotu-private-source"
          rm -f -- "$RUNNER_TEMP/private-checkout.log" "$RUNNER_TEMP/private-build.log" "$RUNNER_TEMP/chotu-source-key" "$RUNNER_TEMP/chotu-source-hosts"

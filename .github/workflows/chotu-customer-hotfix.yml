name: Chotu Live Customer Web Hotfix
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Tested customer source
        type: string
        required: true
      update_notification_api:
        description: Update notification logo and inline-decision metadata
        type: boolean
        default: false
      fresh_account_email:
        description: Optional owner-authorized account for 20 fresh linked notifications after publication
        type: string
        default: ''
      example_email:
        description: Optional owner-requested generated customer account for inbox examples
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: chotu-live-app-admin-release
  cancel-in-progress: false
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git fetch -q --depth=1 origin 9160cf6a27c187e8e800e41a0eb17f993216163b
            git checkout -q --detach "$SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - name: Add owner-requested inbox examples to only the generated account
        if: ${{ inputs.example_email != '' }}
        env:
          EXAMPLE_EMAIL: ${{ inputs.example_email }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXAMPLE_EMAIL" =~ ^chotu\.check\.[a-f0-9]+@example\.com$ ]]
          umask 077
          key="$RUNNER_TEMP/hotfix-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ec2-user@46.137.199.32 "cd /var/www/html && CHOTU_EXAMPLE_ACCOUNT='$EXAMPLE_EMAIL' php" < "$RUNNER_TEMP/chotu-private-source/tools/live/seed-customer-notification-examples.php"
      - name: Preserve and prepare notification controller metadata change
        if: ${{ inputs.update_notification_api }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          umask 077
          key="$RUNNER_TEMP/notification-api-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          file=app/Http/Controllers/api/AppNotificationController.php
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ec2-user@46.137.199.32 "cat '/var/www/html/$file'" > "$RUNNER_TEMP/notification-live.php"
          git show "9160cf6a27c187e8e800e41a0eb17f993216163b:well-known/$file" > "$RUNNER_TEMP/notification-base.php"
          cp "well-known/$file" "$RUNNER_TEMP/notification-new.php"
          sha256sum "$RUNNER_TEMP/notification-live.php" | cut -d ' ' -f 1 > "$RUNNER_TEMP/notification-live.sha"
          if ! cmp -s "$RUNNER_TEMP/notification-live.php" "$RUNNER_TEMP/notification-new.php"; then
            if ! cmp -s "$RUNNER_TEMP/notification-live.php" "$RUNNER_TEMP/notification-base.php"; then
              git merge-file -p "$RUNNER_TEMP/notification-live.php" "$RUNNER_TEMP/notification-base.php" "$RUNNER_TEMP/notification-new.php" > "$RUNNER_TEMP/notification-merged.php"
              mv "$RUNNER_TEMP/notification-merged.php" "$RUNNER_TEMP/notification-new.php"
            fi
          fi
          php -l "$RUNNER_TEMP/notification-new.php"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - name: Test first-load fix and build only live customer web
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          python3 chotu-admin/scripts/prepare-web-defines.py prod "$RUNNER_TEMP/web-defines.json"
          cd chotu_app
          flutter pub get --enforce-lockfile > "$RUNNER_TEMP/hotfix-pub.log" 2>&1
          flutter test --no-pub test/notifications_loading_test.dart test/notification_actions_test.dart
          flutter build web --no-pub --no-web-resources-cdn --base-href /user/ \
            --dart-define-from-file="$RUNNER_TEMP/web-defines.json" \
            --dart-define=CHOTU_REVIEW_DEMO=false > "$RUNNER_TEMP/hotfix-build.log" 2>&1 || { tail -20 "$RUNNER_TEMP/hotfix-build.log"; exit 1; }
          python3 - "$SOURCE_SHA" <<'PYINFO'
          import json,sys
          from pathlib import Path
          Path('build/web/build-info.json').write_text(json.dumps({'commit':sys.argv[1],'environment':'production','api_base':'https://app.developerschotuapp.online','review_demo':False}))
          PYINFO
          tar -czf "$RUNNER_TEMP/customer-web.tar.gz" -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: customer-web-hotfix
          path: ${{ runner.temp }}/customer-web.tar.gz
          retention-days: 7
      - name: Publish ownership-scoped notification metadata
        if: ${{ inputs.update_notification_api }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/notification-api-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          opts=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote=ec2-user@46.137.199.32
          scp "${opts[@]}" "$RUNNER_TEMP/notification-new.php" "$remote:/var/tmp/chotu-notification-api-$GITHUB_RUN_ID.php"
          expected=$(cat "$RUNNER_TEMP/notification-live.sha")
          ssh "${opts[@]}" "$remote" sudo -n bash -s -- "$GITHUB_RUN_ID" "$expected" <<'REMOTE'
          set -euo pipefail
          run=$1
          expected=$2
          [[ "$run" =~ ^[0-9]+$ && "$expected" =~ ^[a-f0-9]{64}$ ]]
          file=/var/www/html/app/Http/Controllers/api/AppNotificationController.php
          test "$(sha256sum "$file" | cut -d ' ' -f 1)" = "$expected"
          cp -p "$file" "/var/backups/chotu-notification-api-$run.php"
          chmod 600 "/var/backups/chotu-notification-api-$run.php"
          php -l "/var/tmp/chotu-notification-api-$run.php"
          owner=$(stat -c '%U' "$file")
          group=$(stat -c '%G' "$file")
          install -o "$owner" -g "$group" -m 644 "/var/tmp/chotu-notification-api-$run.php" "$file.next"
          mv -Tf "$file.next" "$file"
          systemctl reload php-fpm
          REMOTE
      - name: Atomically replace the existing live customer web
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/hotfix-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          opts=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote=ec2-user@46.137.199.32
          scp "${opts[@]}" "$RUNNER_TEMP/customer-web.tar.gz" "$remote:/var/tmp/chotu-web-$GITHUB_RUN_ID.tar.gz"
          ssh "${opts[@]}" "$remote" sudo -n bash -s -- "$SOURCE_SHA" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          sha=$1
          run=$2
          [[ "$sha" =~ ^[a-f0-9]{40}$ && "$run" =~ ^[0-9]+$ ]]
          cd /var/www/html/public
          test -L user
          readlink user > "/var/backups/chotu-web-before-$run"
          mkdir -p "user-releases/$sha"
          tar -xzf "/var/tmp/chotu-web-$run.tar.gz" -C "user-releases/$sha"
          cp user/.htaccess "user-releases/$sha/.htaccess"
          find "user-releases/$sha" -type d -exec chmod 755 {} +
          find "user-releases/$sha" -type f -exec chmod 644 {} +
          ln -s "user-releases/$sha" "user.next-$run"
          mv -Tf "user.next-$run" user
          REMOTE
          curl -fsS https://app.developerschotuapp.online/user/build-info.json > "$RUNNER_TEMP/published.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/published.json"))["commit"]==os.environ["SOURCE_SHA"]'
      - name: Create the requested fresh linked notification batch after the update
        if: ${{ inputs.fresh_account_email != '' }}
        env:
          ACCOUNT_EMAIL: ${{ inputs.fresh_account_email }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_EMAIL" =~ ^chotu\.check\.[a-f0-9]+@example\.com$ ]]
          umask 077
          key="$RUNNER_TEMP/fresh-account-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          opts=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote=ec2-user@46.137.199.32
          tool="/var/tmp/chotu-owner-flow-actions-$GITHUB_RUN_ID.php"
          scp "${opts[@]}" "$RUNNER_TEMP/chotu-private-source/tools/live/create-owner-account-workflows.php" "$remote:$tool"
          ssh "${opts[@]}" "$remote" "CHOTU_ACCOUNT_EMAIL='$ACCOUNT_EMAIL' CHOTU_FLOW_BATCH=owner-account-notification-actions-v2 php '$tool'"

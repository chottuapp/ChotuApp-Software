name: Validate Website Listing Order
on:
  push:
    branches: [main]
    paths:
      - website_order_support.py
      - ranking_support.py
      - main.py
      - czone_source_support.py
      - tests/test_website_order.py
      - .github/workflows/cloud-validate-website-order.yml
permissions:
  contents: write
concurrency:
  group: chotuapp-website-order-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          if ! python -c 'import tkinter'; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-tk
          fi
          python -m pip install -r requirements.txt
      - name: Verify listing order, hyperlink integrity and source boundaries
        env:
          PYTHONPATH: tests:cloud
        run: >-
          python -m unittest tests.test_website_order tests.test_ranking_metadata
          tests.test_czone_source tests.test_source_compatibility tests.test_cloud_diagnostics
      - name: Check bounded public default listings without starting or stopping fetching
        env:
          PYTHONPATH: cloud
        run: |
          python - <<'PY'
          import os,json,time,requests
          from types import SimpleNamespace
          from website_order_support import Capture
          from source_research import publish
          sources=[]
          for base in ('https://missrose.com.pk','https://www.shopmodest.pk','https://vincecare.com','https://laam.com'):
              with requests.Session() as session:
                  session.headers['User-Agent']='ChotuAppCatalogRefresh/1.0'
                  logs=[]
                  g={'S':session,'_chotu_tls':SimpleNamespace(),'_chotu_wait':lambda:None,'_chotu_backoff':lambda seconds,reason:time.sleep(seconds)}
                  capture=Capture(g,base,logs.append,max_requests=4,max_pages=1)
                  evidence=capture.collect()
                  samples=[{'product':key,'category':fact['category'],'subcategory':fact['subcategory'],'position':fact['product_order'],'url':fact['source_url'],'checked_at':fact['checked_at']} for key,fact in list(evidence.items())[:3]]
                  sources.append({'url':base,'placements':len(evidence),'coverage':'bounded_prefix','samples':samples,'logs':logs[-3:],'unsupported_markup':capture.markup_debug})
          report={'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],'validation':'success' if any(s['placements'] for s in sources) else 'no_supported_live_listing_verified','sources':sources,'fetch_runs_unchanged':True}
          publish(report,branch='website-order-reports')
          print(json.dumps(report,indent=2))
          if report['validation']!='success':raise SystemExit(1)
          PY

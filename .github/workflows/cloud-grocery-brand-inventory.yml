name: Read grocery file brands privately
on:
  workflow_dispatch:
    inputs:
      report_public_key:
        description: Ephemeral sealed-box public key for the requested brand list
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: chotuapp-excel-files
          github-token: ${{ github.token }}
          run-id: 42607016680
          path: ${{ runner.temp }}/grocery-export-readonly
      - uses: actions/download-artifact@v4
        with:
          name: chotuapp-checkpoint
          github-token: ${{ github.token }}
          run-id: 42607016680
          path: ${{ runner.temp }}/grocery-checkpoint-readonly
      - name: Read manufacturer column and encrypt the answer
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PUBLIC_KEY: ${{ inputs.report_public_key }}
          GROCERY_CHECKPOINT_ROOT: ${{ runner.temp }}/grocery-checkpoint-readonly
          GROCERY_EXPORT_ROOT: ${{ runner.temp }}/grocery-export-readonly
          PYTHONPATH: cloud:.
        run: python cloud/grocery_brand_inventory.py

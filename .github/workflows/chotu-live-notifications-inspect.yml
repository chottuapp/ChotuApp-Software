name: Chotu Live Notification Runtime Inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: chotu-cloud-release
    steps:
      - name: Inspect runtime paths without production data
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo '::error::Review SSH credential unavailable'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/review-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new ec2-user@46.137.199.32 'bash -s' <<'REMOTE'
          set -eu
          for p in /var/www/html/public/user /var/www/html/public/admin /var/www/html/public/index.html; do
            if test -e "$p"; then stat -c "%F %U %n" "$p"; readlink "$p" || true; fi
          done
          cd /var/www/html
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          foreach(['users','orders'] as $t) echo $t,' id: ',Illuminate\Support\Facades\Schema::getColumnType($t,'id',true),PHP_EOL;
          echo 'fee_table:',Illuminate\Support\Facades\Schema::hasTable('delivery_fee_changes')?'yes':'no',PHP_EOL;
          PHP
          REMOTE

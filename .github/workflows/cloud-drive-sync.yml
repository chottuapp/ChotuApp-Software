name: ChotuApp Rule 804 Google Drive Sync
on:
  workflow_dispatch:
    inputs:
      held_stores:
        description: 'Optional comma-separated stores; re-audit only their saved held or current verified inputs'
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [ChotuApp Cloud Fetch]
    types: [completed]
  push:
    branches: [main]
    paths: [sold_object_category_support.py, cloud/sold_object_audit.py, product_description_support.py, cloud/incomplete_products.py, locked_store_rules.py, cloud/catalogue_object_rules.py, cloud/reviewed_source_types.py, electronics_description_support.py, cloud/description_readability.py, xcessories_purpose_support.py, catalog-inputs/khaadi-mobile/latest.json, cloud/mobile_khaadi_ingest.py, cloud/original_store_ingest.py, cloud/legacy_original_schema.py, cloud/audit804.py, cloud/audit804_automation.py, cloud/hold804_repairs.py, cloud/audit804-reviewed-source.json, cloud/audit804-image-reviews.json, cloud/audit804-removed-source.json, cloud/audit804_semantics.py, cloud/reviewed804_repairs.py, cloud/audit804_delivery.py, cloud/audit804_queue.py, cloud/confirmed-shop-codes.json, cloud/rule804_pipeline.py, cloud/drive_sync.py, cloud/source_research.py, cloud/drive-sync-release.json, .github/workflows/cloud-drive-sync.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: chotuapp-drive-sync
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 8
        with:
          # Historical deliveries and install archives are not runtime inputs.
          # Sparse checkout also enables a blob-filtered fetch in checkout@v4.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*.zip
            !/*.rar
            !/catalog-files/
            !/pc-backups/
            !/catalog-inputs/**/*.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify description-repair dependencies before touching Drive
        env:
          PYTHONPATH: cloud:.
        run: python -c "from description_readability import format_description; from reviewed_source_types import matched; assert 'Green' in format_description('Color Green Ã‚Â '); assert matched({'product_type':'Accessories'},'Rios') is None"
      - name: Verify source repair safeguards before touching Drive
        env:
          PYTHONPATH: tests:cloud:.
        run: python -m unittest test_category_accuracy_recovery test_resume_delivery_repairs test_category_boundaries test_additional_completed_sources test_grocery_scope_repair test_sold_object_categories test_product_descriptions test_incomplete_products test_delivery_generation_retry test_catalogue_recovery_regressions test_audit804_queue test_source_stock_exclusion test_source_numeric_comparisons test_held_source_repairs test_reviewed_photo_gate test_description_readability test_electronics_descriptions test_fresh_hold_recovery test_delivery_download_recovery test_drive_delivery_retry test_merchant_tag_recovery test_source_named_service test_owner_photo_pause test_new_catalogue_objects test_new_store_garments test_duplicate_identity_recovery test_school_garment_audit_recovery test_audit804_delivery test_stalled_delivery_repair test_laam_source test_laam_price_scope_discovery test_laam_scoped_stock test_laam_incomplete_listing test_large_github_reports -q
      - name: Install checksum-verified rclone with ID-preserving duplicate archival
        run: bash cloud/install_verified_rclone.sh
      - name: Rule 804 checked files only, then checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          CHOTU_DRIVE_RCLONE_CONFIG: ${{ secrets.CHOTU_DRIVE_RCLONE_CONFIG }}
          CHOTU_REPAIR_HELD_STORES: ${{ inputs.held_stores }}
        run: python cloud/drive_sync.py
      - name: Publish Drive links after verified uploads
        env:
          GH_TOKEN: ${{ github.token }}
          CHOTU_DRIVE_RCLONE_CONFIG: ${{ secrets.CHOTU_DRIVE_RCLONE_CONFIG }}
        run: python cloud/drive_catalog.py

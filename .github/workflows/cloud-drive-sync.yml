name: ChotuApp Rule 804 Google Drive Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [ChotuApp Cloud Fetch]
    types: [completed]
  push:
    branches: [main]
    paths: [cloud/catalogue_object_rules.py, cloud/reviewed_source_types.py, electronics_description_support.py, cloud/description_readability.py, xcessories_purpose_support.py, catalog-inputs/khaadi-mobile/latest.json, cloud/mobile_khaadi_ingest.py, cloud/original_store_ingest.py, cloud/legacy_original_schema.py, cloud/audit804.py, cloud/audit804_automation.py, cloud/hold804_repairs.py, cloud/audit804-reviewed-source.json, cloud/audit804-image-reviews.json, cloud/audit804-removed-source.json, cloud/audit804_semantics.py, cloud/reviewed804_repairs.py, cloud/audit804_delivery.py, cloud/audit804_queue.py, cloud/confirmed-shop-codes.json, cloud/rule804_pipeline.py, cloud/drive_sync.py, cloud/source_research.py, cloud/drive-sync-release.json, .github/workflows/cloud-drive-sync.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: chotuapp-drive-sync
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify description-repair dependencies before touching Drive
        env:
          PYTHONPATH: cloud:.
        run: python -c "from description_readability import format_description; from reviewed_source_types import matched; assert 'Green' in format_description('Color Green Ã‚Â '); assert matched({'product_type':'Accessories'},'Rios') is None"
      - name: Verify source repair safeguards before touching Drive
        env:
          PYTHONPATH: tests:cloud:.
        run: python -m unittest test_audit804_queue test_source_stock_exclusion test_source_numeric_comparisons test_held_source_repairs test_reviewed_photo_gate test_description_readability test_electronics_descriptions test_fresh_hold_recovery test_delivery_download_recovery test_merchant_tag_recovery test_source_named_service test_owner_photo_pause -q
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Rule 804 checked files only, then checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          CHOTU_DRIVE_RCLONE_CONFIG: ${{ secrets.CHOTU_DRIVE_RCLONE_CONFIG }}
        run: python cloud/drive_sync.py
      - name: Publish Drive links after verified uploads
        env:
          GH_TOKEN: ${{ github.token }}
          CHOTU_DRIVE_RCLONE_CONFIG: ${{ secrets.CHOTU_DRIVE_RCLONE_CONFIG }}
        run: python cloud/drive_catalog.py

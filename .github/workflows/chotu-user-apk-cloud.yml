name: Chotu Signed User APK Cloud Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed private User App source commit
        required: true
        type: string
      publication_tools_sha:
        description: Optional reviewed publishing-tools commit; signed app identity remains source_sha
        required: false
        default: ''
        type: string
      build_run:
        description: Optional successful build job run to reuse for native checks
        required: false
        default: ''
        type: string
      native_run:
        description: Optional successful native test run for publication-only resume
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: chotu-signed-user-apk-cloud
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.build_run == '' && inputs.native_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - name: Require original customer signing configuration
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: test -n "$STORE" && test -n "$PROPERTIES"
      - name: Make disk space on this ephemeral cloud runner only
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          if [[ -d "$ANDROID_HOME/ndk" ]]; then
            for ndk in "$ANDROID_HOME"/ndk/*; do
              [[ "$(basename "$ndk")" == 28.2.13676358 ]] || sudo rm -rf "$ndk"
            done
          fi
          sudo docker image prune -af > /dev/null || true
          python3 -c 'import shutil; assert shutil.disk_usage("/").free >= 24*1024**3, "Not enough cloud runner disk for APK"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: false
      - name: Test compile and sign User APK without public source logs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          if ! bash scripts/cloud/build-user-apk.sh 3>&1 > "$RUNNER_TEMP/private-apk-build.log" 2>&1; then
            echo '::error::Customer APK build failed at the last reported stage. No private source/signing logs were uploaded; no APK was published.'
            exit 1
          fi
      - name: Encrypt failed compilation diagnostics for private review
        if: failure()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/private-apk-build.log" || exit 0
          printf '%s'  | base64 -d > "$RUNNER_TEMP/diagnostic-public.crt"
          openssl cms -encrypt -aes256 -binary -outform DER -in "$RUNNER_TEMP/private-apk-build.log" -out "$RUNNER_TEMP/android-diagnostic.enc" "$RUNNER_TEMP/diagnostic-public.crt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: encrypted-android-diagnostic
          path: ${{ runner.temp }}/android-diagnostic.enc
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: production-user-apk
          path: |
            ${{ runner.temp }}/ChotuApp-User-1.1.26-68.apk
            ${{ runner.temp }}/ChotuApp-User-1.1.26-68.aab
            ${{ runner.temp }}/customer-apk-build-info.json
          retention-days: 1
      - name: Remove private build source and temporary files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chotu-private-source" "$RUNNER_TEMP/customer-signing"
          rm -f -- "$RUNNER_TEMP/private-checkout.log" "$RUNNER_TEMP/private-apk-build.log" "$RUNNER_TEMP/chotu-source-key" "$RUNNER_TEMP/chotu-source-hosts" "$RUNNER_TEMP/production-android.json" "$RUNNER_TEMP/original-resources.txt" "$RUNNER_TEMP/original-manifest.xml"
  native-test:
    needs: build
    if: ${{ always() && inputs.native_run == '' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.build_run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: production-user-apk
          path: ${{ runner.temp }}/customer-apk
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify reused signed build job succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/apk-build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" > "$RUNNER_TEMP/apk-build-jobs.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);r=json.loads((p/'apk-build-run.json').read_text());jobs=json.loads((p/'apk-build-jobs.json').read_text())['jobs']
          assert r['path']=='.github/workflows/chotu-user-apk-cloud.yml' and r['event']=='workflow_dispatch'
          assert r['repository']['full_name']=='chottuapp/ChotuApp-Software'
          assert any(j['name']=='build' and j['conclusion']=='success' for j in jobs),'Original APK build job did not succeed'
          PY
      - name: Verify signed artifact identity before native checks
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'customer-apk'
          m=json.loads((p/'customer-apk-build-info.json').read_text())
          assert m['commit']==os.environ['SOURCE_SHA'] and m['version_code']==68 and m['version_name']=='1.1.26'
          assert m['package']=='com.app.chotu' and m['api_base']=='https://app.chotuapp.com'
          assert hashlib.sha256((p/'ChotuApp-User-1.1.26-68.apk').read_bytes()).hexdigest()==m['sha256']
          PY
      - name: Enable native emulator acceleration on cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/chotu-private-source/scripts/cloud/smoke-user-apk.sh" > "$RUNNER_TEMP/private-native-test.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: customer-native-launch
          path: ${{ runner.temp }}/customer-apk/customer-native-launch.png
          retention-days: 1
      - name: Remove private native-test source and logs
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chotu-private-source"
          rm -f -- "$RUNNER_TEMP/private-checkout.log" "$RUNNER_TEMP/private-native-test.log" "$RUNNER_TEMP/customer-launch-log.txt" "$RUNNER_TEMP/chotu-source-key" "$RUNNER_TEMP/chotu-source-hosts"
  publish:
    needs: native-test
    if: ${{ always() && (needs['native-test'].result == 'success' || (needs['native-test'].result == 'skipped' && inputs.native_run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PUBLISH_TOOLS_SHA: ${{ inputs.publication_tools_sha || inputs.source_sha }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$PUBLISH_TOOLS_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$PUBLISH_TOOLS_SHA"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$PUBLISH_TOOLS_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: production-user-apk
          path: ${{ runner.temp }}/customer-apk
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require successful native check of this exact signed build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run || github.run_id }}
          NATIVE_RUN: ${{ inputs.native_run || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$NATIVE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" > "$RUNNER_TEMP/verified-apk-build-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" > "$RUNNER_TEMP/verified-native-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/verified-native-jobs.json"
          python3 - <<'PYGATE'
          import os,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);run=json.loads((p/'verified-native-run.json').read_text());jobs=json.loads((p/'verified-native-jobs.json').read_text())['jobs'];builds=json.loads((p/'verified-apk-build-jobs.json').read_text())['jobs']
          assert run['path']=='.github/workflows/chotu-user-apk-cloud.yml' and run['event']=='workflow_dispatch'
          assert run['repository']['full_name']=='chottuapp/ChotuApp-Software' and run['head_branch']=='main'
          assert any(j['name']=='build' and j['conclusion']=='success' for j in builds)
          native=[j for j in jobs if j['name']=='native-test' and j['conclusion']=='success'];assert len(native)==1
          (p/'verified-native-job-id').write_text(str(native[0]['id']))
          PYGATE
          native_job=$(cat "$RUNNER_TEMP/verified-native-job-id")
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$native_job/logs" > "$RUNNER_TEMP/verified-native-public.log"
          python3 - <<'PYIDENTITY'
          import os,re,json,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);m=json.loads((p/'customer-apk/customer-apk-build-info.json').read_text());text=(p/'verified-native-public.log').read_text()
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          assert re.search(r'\brun-id:\s*'+re.escape(os.environ['BUILD_RUN'])+r'\b',text),'Native check used a different artifact run'
          assert re.search(r'\bSOURCE_SHA:\s*'+re.escape(os.environ['SOURCE_SHA'])+r'\b',text),'Native check used different source'
          assert m['commit']==os.environ['SOURCE_SHA'] and m['version_name']=='1.1.26' and m['version_code']==68
          assert hashlib.sha256((p/'customer-apk/ChotuApp-User-1.1.26-68.apk').read_bytes()).hexdigest()==m['sha256']
          print('Verified successful original build, matching signed artifact, approved source and completed native upgrade test.')
          PYIDENTITY
      - name: Clean only this release’s failed partial transfers and inspect temporary storage
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/storage-check-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -T 15 -H 46.137.199.32 >> "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$key" ec2-user@46.137.199.32 'sudo -n rm -rf -- /tmp/chotu-customer-apk-40374422890 /tmp/chotu-customer-apk-40377599568 /tmp/chotu-customer-apk-40377858128; df -h /tmp /var/tmp /var/www/html; df -i /tmp /var/tmp'
      - name: Publish only the signed native-tested customer APK
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          if ! bash scripts/cloud/publish-user-apk.sh > "$RUNNER_TEMP/private-apk-publish.log" 2>&1; then
            echo '::error::APK publication failed; no private server logs were uploaded.'
            exit 1
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);m=json.loads((p/'customer-publication.json').read_text())
          assert m['version']=='1.1.26' and m['version_code']==68
          print('Verified User APK download: '+m['download_url'])
          print('Verified User AAB download: '+m['aab_url'])
          PY
      - name: Encrypt failed publication diagnostics for private review
        if: failure()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/private-apk-publish.log" || exit 0
          printf '%s'  | base64 -d > "$RUNNER_TEMP/diagnostic-public.crt"
          openssl cms -encrypt -aes256 -binary -outform DER -in "$RUNNER_TEMP/private-apk-publish.log" -out "$RUNNER_TEMP/publish-diagnostic.enc" "$RUNNER_TEMP/diagnostic-public.crt"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: encrypted-publication-diagnostic
          path: ${{ runner.temp }}/publish-diagnostic.enc
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: customer-apk-publication
          path: ${{ runner.temp }}/customer-publication.json
          retention-days: 1
      - name: Remove temporary source logs and deployment key
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chotu-private-source"
          rm -f -- "$RUNNER_TEMP/private-checkout.log" "$RUNNER_TEMP/private-apk-publish.log" "$RUNNER_TEMP/customer-publish-key" "$RUNNER_TEMP/chotu-source-key" "$RUNNER_TEMP/chotu-source-hosts"

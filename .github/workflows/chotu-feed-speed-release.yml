name: Chotu Feed Speed Search and Product Links Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed private Feed/search/image performance commit
        required: true
        type: string
      build_run:
        description: Successful cloud User and Admin build run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: chotu-cloud-production-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          FIREBASE_ACCESS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHOTU_ADMIN_APP }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          test -n "$DEPLOY_KEY" && test -n "$FIREBASE_ACCESS" || { echo "::error::Encrypted release access has not been configured."; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git checkout -q --detach FETCH_HEAD
            git fetch -q --depth=1 origin 5ecb2661b966c3cb2a0d15b33c3fd230d56f4ff6
            git fetch -q --depth=1 origin 1d6bd5c4ada60e3289ef6bed456a04bb23cd04f9
            git fetch -q --depth=1 origin dfe67a6ca768c679589f3ad1d64ed98b89ff80d2
            git fetch -q --depth=1 origin 428b40de453e2f1092c587d7f7eaa99aa9e59014
            git fetch -q --depth=1 origin b008c47c046a0f55f42fc5f5e8952edfb8ec7490
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: production-user
          path: ${{ runner.temp }}/production-user
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: production-admin
          path: ${{ runner.temp }}/chotu-private-source/chotu-admin/build/web
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backed-up image/search backend and User/Admin release
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHOTU_ADMIN_APP }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          if ! bash scripts/cloud/publish-feed-speed.sh 3>&1 > "$RUNNER_TEMP/private-feed-speed-release.log" 2>&1; then
            python3 - <<'PYERROR'
          import os
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'private-feed-speed-release.log').read_text(errors='replace')
          inner=Path(os.environ['RUNNER_TEMP'])/'receipt-private-backend.log'
          if inner.exists(): text+='\n'+inner.read_text(errors='replace')
          for name in ['feed-profile-before.json','feed-profile-after.json']:
              profile=Path(os.environ['RUNNER_TEMP'])/name
              if profile.exists(): text+='\n'+profile.read_text(errors='replace')
          for safe in ['Feed paging validation failed','Paging rank cache did not reuse its bounded block','Host guard','Search returned no suit products','Search returned a substring-only match','Receipt payload missing','Receipt field missing']:
              if safe in text: print('::error::'+safe)
          import re
          for code in set(re.findall(r'SQLSTATE\[[A-Z0-9]+\]',text)): print('::error::Database diagnostic '+code)
          if 'Production code conflict' in text: print('::error::Existing server code differs from the reviewed baseline; installation stopped without overriding it.')
          else: print('::error::Feed performance release check failed. Private server/source logs were not uploaded.')
          PYERROR
            exit 1
          fi
          echo 'User App: https://app.chotuapp.com/user/'
          echo 'Admin Panel: https://chotu-admin-app.web.app/'
      - name: Remove temporary private files and credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chotu-private-source"
          rm -f -- "$RUNNER_TEMP/private-checkout.log" "$RUNNER_TEMP/private-feed-speed-release.log" "$RUNNER_TEMP/receipt-private-backup.json" "$RUNNER_TEMP/receipt-private-backend.log" "$RUNNER_TEMP/receipt-release-key" "$RUNNER_TEMP/firebase-receipt.json" "$RUNNER_TEMP/chotu-source-key" "$RUNNER_TEMP/chotu-source-hosts"

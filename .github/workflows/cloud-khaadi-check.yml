name: ChotuApp Khaadi Public Page Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud/khaadi_probe.py, cloud/start_khaadi_cloud.py, .github/workflows/cloud-khaadi-check.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: chotuapp-khaadi-source-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verify permitted public product and size pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/khaadi_probe.py
      - name: Start fresh cloud Khaadi after verified Pakistan public source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/start_khaadi_cloud.py
      - name: Retain credential-free public source result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaadi-public-route-check
          path: source-diagnostics/khaadi-public-route.json
          retention-days: 3

name: Transfer Reviewed Drive Batch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud/move_reviewed_drive_batch.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: chotuapp-drive-sync
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Verify copies before removing transferred source files
        env:
          GH_TOKEN: ${{ github.token }}
          CHOTU_DRIVE_RCLONE_CONFIG: ${{ secrets.CHOTU_DRIVE_RCLONE_CONFIG }}
        run: python cloud/move_reviewed_drive_batch.py

name: Inspect Public Bundle Contents for 804 Recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud/bundle_public_probe.py, .github/workflows/cloud-bundle-check.yml]
permissions:
  contents: write
concurrency:
  group: chotuapp-bundle-source-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright requests beautifulsoup4
      - run: python -m playwright install --with-deps chromium
      - env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: cloud:.
        run: python cloud/bundle_public_probe.py

name: Chotu Owner Account Live Workflows
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed account setup tool source
        required: true
        type: string
      account_email:
        description: Owner-authorized generated customer account
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chotu-owner-account-workflows
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - name: Create actual account-scoped workflows and replace text-only examples
        env:
          ACCOUNT_EMAIL: ${{ inputs.account_email }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_EMAIL" =~ ^chotu\.check\.[a-f0-9]+@example\.com$ ]]
          umask 077
          key="$RUNNER_TEMP/owner-flow-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          opts=(-i "$key" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          remote=ec2-user@46.137.199.32
          tool="/var/tmp/chotu-owner-flows-$GITHUB_RUN_ID.php"
          scp "${opts[@]}" "$RUNNER_TEMP/chotu-private-source/tools/live/create-owner-account-workflows.php" "$remote:$tool"
          ssh "${opts[@]}" "$remote" "CHOTU_ACCOUNT_EMAIL='$ACCOUNT_EMAIL' php '$tool'"

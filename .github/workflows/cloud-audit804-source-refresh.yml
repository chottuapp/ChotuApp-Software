name: Refresh Public Facts for 804 Audit Repairs
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: [ChotuApp Rule 804 Google Drive Sync]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud/audit804-source-request.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: chotuapp-audit804-source-refresh
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - env:
          AUTO_AUDIT_EVIDENCE: ${{ github.event_name != 'push' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: cloud:.
        run: python cloud/audit804_source_refresh.py

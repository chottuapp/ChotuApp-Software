name: Refresh Public Facts for 804 Audit Repairs
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloud/audit804-source-request.json]
permissions:
  contents: write
concurrency:
  group: chotuapp-audit804-source-refresh
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - env:
          AUTO_AUDIT_EVIDENCE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: cloud:.
        run: python cloud/audit804_source_refresh.py

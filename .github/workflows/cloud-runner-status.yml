name: ChotuApp Combined Runner Status
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [ChotuApp Cloud Fetch, ChotuApp Rule 804 Google Drive Sync, Transfer Reviewed Drive Batch]
    types: [completed]
  push:
    branches: [main]
    paths: [cloud/status-check-request.json, cloud/runner_status.py, .github/workflows/cloud-runner-status.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: chotuapp-status-only
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Publish current cloud status without modifying fetch or Drive data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/runner_status.py

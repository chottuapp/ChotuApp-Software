name: ChotuApp Validate Fetch Update
on:
  push:
    branches: [main]
    paths: [cloud/fetch-update-release.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: chotuapp-validate-fetch-update
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies
        run: |
          if ! python -c 'import tkinter'; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-tk
          fi
          python -m pip install -r requirements.txt
      - name: Verify export, source fixtures, checkpoints and continuation
        id: tests
        env:
          PYTHONPATH: tests:cloud
        run: >-
          python -m unittest
          tests.test_subcategory_inference tests.test_fetch_error_fixes tests.test_rate_limit_policy tests.test_website_categories tests.test_website_order tests.test_ranking_metadata tests.test_store_priority tests.test_variant_identity_update tests.test_compact_response_cache
          tests.test_cloud_diagnostics tests.test_cloud_quality_update tests.test_fetch_update_release
          tests.test_resume_support.DurableTests tests.test_high_speed_cache
          tests.test_fast_fetch tests.test_continuation_policy tests.test_seran_source
          tests.test_laam_source tests.test_source_compatibility tests.test_checkpoint_parts tests.test_checkpoint_finalization
          tests.test_cloud.CloudTests tests.test_app.ExportTests
          tests.test_app.PriceVerificationTests tests.test_app.FreshFetchTests
          tests.test_app.CatalogQualityTests tests.test_source_research
      - name: Verify source categories on bounded public samples
        id: categories
        env:
          PYTHONPATH: cloud:.
        run: python cloud/check_strict_categories.py
      - name: Check the exact Czone server failure with bounded retries
        id: source_fix
        env:
          PYTHONPATH: cloud:.
        run: python cloud/check_fetch_fixes.py
      - name: Publish validation report and resume saved fetch only after success
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cloud/fetch_update_release.py --validation '${{ steps.tests.outcome == 'success' && steps.categories.outcome == 'success' && steps.source_fix.outcome == 'success' && 'success' || 'failure' }}'

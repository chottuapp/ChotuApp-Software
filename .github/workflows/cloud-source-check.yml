name: ChotuApp Public Source Check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chotuapp-source-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect failed public sources and publish safe summary
        run: python cloud/source_probe.py --publish
      - name: Retain public response fixtures for adapter verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chotuapp-public-source-check
          path: source-diagnostics/
          retention-days: 1

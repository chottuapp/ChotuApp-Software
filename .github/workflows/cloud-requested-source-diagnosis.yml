name: Diagnose Four Requested Sources
on:
  workflow_dispatch:
    inputs:
      store:
        description: Optional exact requested seller for a bounded single-source check
        required: false
        type: string
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: cloud:.
          REQUESTED_SOURCE_STORE: ${{ inputs.store }}
        run: python cloud/requested_source_diagnosis.py

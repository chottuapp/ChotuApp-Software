name: Chotu Live Notifications App and Admin Update
on:
  workflow_dispatch:
    inputs:
      customer_only:
        description: Update customer and backend without rebuilding unchanged admin
        type: boolean
        default: false
      backend_base_sha:
        description: Source base for preserving existing live edits
        type: string
        default: '34cd993e034af81e14f4524955cafb40d2daacf4'
      source_sha:
        description: Reviewed tested feature source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chotu-live-app-admin-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BACKEND_BASE_SHA: ${{ inputs.backend_base_sha }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$BACKEND_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git fetch -q --depth=1 origin "$BACKEND_BASE_SHA"
            git checkout -q --detach "$SOURCE_SHA"
            git checkout -q --detach "$SOURCE_SHA"
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - name: Match selected backend changes against actual live files
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHOTU_ADMIN_APP }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" && test -n "$FIREBASE_ACCOUNT"
          cd "$RUNNER_TEMP/chotu-private-source"
          umask 077
          key="$RUNNER_TEMP/live-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          opts=(-i "$key" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          remote=ec2-user@46.137.199.32
          scp "${opts[@]}" tools/live/backend.manifest "$remote:/var/tmp/chotu-notifications-$GITHUB_RUN_ID.manifest"
          ssh "${opts[@]}" "$remote" bash -s -- "$GITHUB_RUN_ID" > "$RUNNER_TEMP/live-code.tar.gz" <<'REMOTE'
          set -euo pipefail
          for run in 41356386029 41357744877; do
            for archive in customer.tar.gz admin.tar.gz backend.tar.gz; do
              rm -f "/tmp/chotu-review-$run/$archive"
            done
          done
          rm -f /tmp/chotu-live-notifications-41359067532/package.tar.gz
          df -h /tmp /var/tmp >&2
          cd /var/www/html
          while IFS= read -r file; do
            if test -f "$file"; then printf '%s\n' "$file"; fi
          done < "/var/tmp/chotu-notifications-$1.manifest" | tar -czf - -T -
          REMOTE
          python3 tools/live/plan-backend.py well-known "$RUNNER_TEMP/live-code.tar.gz" "$RUNNER_TEMP/live-candidate"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - name: Build existing live app and admin without demo mode
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          python3 chotu-admin/scripts/prepare-web-defines.py prod "$RUNNER_TEMP/production-web.json"
          for app in chotu_app chotu-admin; do
            if [[ "${{ inputs.customer_only }}" == true && "$app" == chotu-admin ]]; then continue; fi
            (
              cd "$app"
              flutter pub get --enforce-lockfile
              base=/
              folder=admin
              if [[ "$app" == chotu_app ]]; then base=/user/; folder=customer; fi
              flutter build web --no-pub --no-web-resources-cdn --base-href "$base" \
                --dart-define-from-file="$RUNNER_TEMP/production-web.json" \
                --dart-define=CHOTU_REVIEW_DEMO=false
              python3 - "$SOURCE_SHA" <<'PYINFO'
          import json,sys
          from pathlib import Path
          Path('build/web/build-info.json').write_text(json.dumps({'commit':sys.argv[1],'environment':'production','api_base':'https://app.developerschotuapp.online','review_demo':False}))
          PYINFO
              tar -czf "$RUNNER_TEMP/$folder.tar.gz" -C build/web .
            ) > "$RUNNER_TEMP/$app-production-web.log" 2>&1 || {
              echo "::error::$app production web build failed"
              tail -30 "$RUNNER_TEMP/$app-production-web.log"
              exit 1
            }
            echo "$app production browser build passed"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: production-browser-builds
          path: |
            ${{ runner.temp }}/customer.tar.gz
            ${{ runner.temp }}/admin.tar.gz
          retention-days: 7
      - name: Apply only matched live backend changes and customer web
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          key="$RUNNER_TEMP/live-key"
          umask 077
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          opts=(-i "$key" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          remote=ec2-user@46.137.199.32
          stage="/var/tmp/chotu-live-notifications-$GITHUB_RUN_ID"
          mkdir -p "$RUNNER_TEMP/live-stage/candidate"
          cp -a "$RUNNER_TEMP/live-candidate/." "$RUNNER_TEMP/live-stage/candidate/"
          cp tools/live/backend.manifest "$RUNNER_TEMP/live-stage/manifest"
          cp tools/live/install-notifications.sh well-known/tools/{apply-production-code.py,restore-production-code.py} "$RUNNER_TEMP/live-stage/"
          cp "$RUNNER_TEMP/customer.tar.gz" "$RUNNER_TEMP/live-stage/"
          tar -czf "$RUNNER_TEMP/live-stage.tar.gz" -C "$RUNNER_TEMP/live-stage" .
          ssh "${opts[@]}" "$remote" "mkdir -m 700 '$stage'"
          scp "${opts[@]}" "$RUNNER_TEMP/live-stage.tar.gz" "$remote:$stage/package.tar.gz"
          ssh "${opts[@]}" "$remote" "tar -xzf '$stage/package.tar.gz' -C '$stage'; sudo -n bash '$stage/install-notifications.sh' '$GITHUB_RUN_ID' '$SOURCE_SHA'"
          curl -fsS https://app.developerschotuapp.online/user/build-info.json > "$RUNNER_TEMP/live-user-info.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/live-user-info.json"));assert d["commit"]==os.environ["SOURCE_SHA"] and not d["review_demo"]'
      - uses: actions/setup-node@v4
        if: ${{ !inputs.customer_only }}
        with:
          node-version: '22'
      - name: Publish the existing production admin panel
        if: ${{ !inputs.customer_only }}
        env:
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHOTU_ADMIN_APP }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source/chotu-admin"
          credentials="$RUNNER_TEMP/firebase-live.json"
          umask 077
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_ACCOUNT" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          npx --yes firebase-tools@14.12.0 deploy --only hosting:production --project chotu-admin-app --non-interactive > "$RUNNER_TEMP/firebase-live.log" 2>&1 || { tail -12 "$RUNNER_TEMP/firebase-live.log"; exit 1; }
          curl -fsS "https://chotu-admin-app.web.app/build-info.json?release=$SOURCE_SHA" > "$RUNNER_TEMP/live-admin-info.json"
          python3 -c 'import json,os;d=json.load(open(os.environ["RUNNER_TEMP"]+"/live-admin-info.json"));assert d["commit"]==os.environ["SOURCE_SHA"] and not d["review_demo"]'
          echo 'Live app: https://app.developerschotuapp.online/user/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live admin: https://chotu-admin-app.web.app/' >> "$GITHUB_STEP_SUMMARY"

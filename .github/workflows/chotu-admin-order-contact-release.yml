name: Chotu Admin Order Details and Email Release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed admin customer details source commit
        required: true
        type: string
      build_run:
        description: Successful admin cloud browser build
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: chotu-cloud-production-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: chotu-cloud-release
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Require reviewed source and restricted build credential
        env:
          SOURCE_KEY: ${{ secrets.CHOTU_APP_SOURCE_KEY }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$SOURCE_KEY" || { echo '::error::Run the one-time Chotu cloud setup. No PC runner or paid fallback is used.'; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "::error::Encrypted release access has not been configured."; exit 1; }
          umask 077
          key="$RUNNER_TEMP/chotu-source-key"
          trap 'rm -f "$key" "$RUNNER_TEMP/chotu-source-hosts"' EXIT
          printf '%s\n' "$SOURCE_KEY" > "$key"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$RUNNER_TEMP/chotu-source-hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/chotu-source-hosts"
          if ! (
            git init -q "$RUNNER_TEMP/chotu-private-source"
            cd "$RUNNER_TEMP/chotu-private-source"
            git remote add origin git@github.com:chottuapp/ChotuProject-development.git
            git fetch -q --depth=1 origin "$SOURCE_SHA"
            git checkout -q --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ) > "$RUNNER_TEMP/private-checkout.log" 2>&1; then
            echo '::error::Private checkout failed. Check the read-only deploy key and approved commit; private logs are not uploaded.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: production-admin
          path: ${{ runner.temp }}/chotu-private-source/chotu-admin/build/web
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tested admin artifact before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/contact-build.json"
          python3 - <<'PYGUARD'
          import json,os,subprocess
          from pathlib import Path
          run=json.loads((Path(os.environ['RUNNER_TEMP'])/'contact-build.json').read_text())
          assert run['conclusion']=='success' and run['path']=='.github/workflows/chotu-private-app-cloud.yml'
          info=json.loads(Path('chotu-admin/build/web/build-info.json').read_text())
          assert info['client']=='admin' and info['environment']=='production' and info['api_base']=='https://app.developerschotuapp.online'
          for name,tree in info['source_trees'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()==tree
          PYGUARD
      - name: Back up and install only admin order customer backend
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          if ! bash scripts/cloud/publish-admin-order-contact.sh > "$RUNNER_TEMP/contact-private-backend.log" 2>&1; then
            if grep -q 'Production code conflict' "$RUNNER_TEMP/contact-private-backend.log"; then
              grep 'Production code conflict' "$RUNNER_TEMP/contact-private-backend.log"
            fi
            echo '::error::Admin order contact backend release failed; private customer data and logs are not published.'
            exit 1
          fi
          echo 'Targeted backend files installed with backup; read-only admin receipt, order and email rendering checks passed.'
      - name: Publish tested admin panel and verify exact live version
        env:
          FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHOTU_ADMIN_APP }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chotu-private-source"
          if ! bash scripts/cloud/publish-sync-admin.sh > "$RUNNER_TEMP/contact-private-admin.log" 2>&1; then
            echo '::error::Admin hosting publication or exact-version verification failed; private logs withheld.'
            exit 1
          fi
          echo 'Admin panel published: https://chotu-admin-app.web.app/ . Exact live build matches tested artifact.'
      - name: Remove private temporary checkout
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/chotu-private-source"
          rm -f -- "$RUNNER_TEMP/private-checkout.log" "$RUNNER_TEMP/chotu-source-key" "$RUNNER_TEMP/chotu-source-hosts"
          rm -f -- "$RUNNER_TEMP/contact-private-backend.log" "$RUNNER_TEMP/contact-private-admin.log" "$RUNNER_TEMP/contact-build.json" "$RUNNER_TEMP/order-contact-key"

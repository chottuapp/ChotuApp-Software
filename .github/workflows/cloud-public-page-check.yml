name: Check normal public product pages
on:
  workflow_dispatch:
    inputs:
      stores:
        description: JSON list of approved exact source names
        type: string
        default: '["Computer Zone","Gift4U","Axis PK"]'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Normal anonymous browser; stop at denial or challenge
        env:
          PUBLIC_STORE_NAMES: ${{ inputs.stores }}
        run: python cloud/public_page_access_check.py

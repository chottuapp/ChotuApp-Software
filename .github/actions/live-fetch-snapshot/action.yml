name: Publish live fetch snapshot
description: Wait while the existing extractor continues, then publish logs and completed files.
inputs:
  seconds:
    description: Snapshot interval in seconds
    default: '300'
outputs:
  finished:
    value: ${{ steps.snapshot.outputs.finished }}
runs:
  using: composite
  steps:
    - id: snapshot
      shell: bash
      env:
        SNAPSHOT_SECONDS: ${{ inputs.seconds }}
      run: python cloud/live_snapshot.py --data .cloud-data --seconds "$SNAPSHOT_SECONDS"
    - name: Publish live text log
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: chotuapp-live-logs
        path: .cloud-data/live-diagnostics/
        overwrite: true
        retention-days: 14
    - name: Publish newly completed Excel files
      if: steps.snapshot.outputs.files_changed == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: chotuapp-excel-files
        path: .cloud-data/live-excel/
        overwrite: true
        retention-days: 14
    - name: Publish automated Rule 804 files for fresh batch
      if: steps.snapshot.outputs.files_changed == 'true' && startsWith(env.CLOUD_RUNNER_GROUP, 'fresh26-')
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: chotuapp-rule804-files
        path: .cloud-data/rule804-excel/
        overwrite: true
        if-no-files-found: ignore
        retention-days: 3
    - name: Trigger cloud Drive sync after a changed Rule 804 snapshot
      if: steps.snapshot.outputs.files_changed == 'true' && (startsWith(env.CLOUD_RUNNER_GROUP, 'fresh26-') || startsWith(env.CLOUD_RUNNER_GROUP, 'audit804-'))
      continue-on-error: true
      shell: bash
      run: gh workflow run cloud-drive-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
